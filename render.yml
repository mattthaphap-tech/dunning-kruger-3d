name: Render Dunning-Kruger 3D

# Pattern proven in mattthaphap-tech/hihu and mattthaphap-tech/pak-darto:
# Node 24, Chrome via .deb (apt-key does NOT exist on ubuntu-latest /
# Ubuntu 26.04), software ANGLE (swangle) -- --gl=angle fails to create a
# WebGL context on GH runners, audio reassembled from base64 parts,
# chunked render + ffmpeg concat + audio mux.
# Triggered manually via workflow_dispatch.
on:
  workflow_dispatch:

jobs:
  render-chunk:
    name: chunk ${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { start: 0, end: 232 }
          - { start: 233, end: 465 }
          - { start: 466, end: 698 }
          - { start: 699, end: 931 }
          - { start: 932, end: 1164 }
          - { start: 1165, end: 1397 }
          - { start: 1398, end: 1630 }
          - { start: 1631, end: 1859 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version

      - name: Install dependencies
        run: npm install

      - name: Download character model
        run: |
          mkdir -p public
          curl -sL -o public/character.glb "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/RobotExpressive/RobotExpressive.glb"
          file public/character.glb
          ls -la public/character.glb
          head -c 4 public/character.glb | grep -q glTF || { echo "character.glb is not a valid GLB"; exit 1; }

      - name: Reassemble voiceover
        run: |
          mkdir -p public
          cat audio-parts/voiceover-dk.mp3.b64.part-* | base64 -d > public/voiceover-dk.mp3
          ls -la public/voiceover-dk.mp3

      - name: Render chunk ${{ matrix.start }}-${{ matrix.end }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/render-chunk.mjs ${{ matrix.start }} ${{ matrix.end }}

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.start }}-${{ matrix.end }}
          path: out/dk/chunks/chunk-${{ matrix.start }}-${{ matrix.end }}.mp4
          retention-days: 7

  concat:
    name: concat + mux audio
    needs: render-chunk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Reassemble voiceover
        run: |
          mkdir -p public
          cat audio-parts/voiceover-dk.mp3.b64.part-* | base64 -d > public/voiceover-dk.mp3
          ls -la public/voiceover-dk.mp3

      - name: Download chunks
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true

      - name: Concat + mux audio
        run: |
          mkdir -p out/dk
          ls -la chunks/
          cd chunks
          printf "file 'chunk-0-232.mp4'\nfile 'chunk-233-465.mp4'\nfile 'chunk-466-698.mp4'\nfile 'chunk-699-931.mp4'\nfile 'chunk-932-1164.mp4'\nfile 'chunk-1165-1397.mp4'\nfile 'chunk-1398-1630.mp4'\nfile 'chunk-1631-1859.mp4'\n" > concat.txt
          cat concat.txt
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy ../video-only.mp4
          cd ..
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 video-only.mp4
          ffmpeg -y -i video-only.mp4 -i public/voiceover-dk.mp3 -c:v copy -c:a aac -b:a 192k out/dk/dunning-kruger-62s.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 out/dk/dunning-kruger-62s.mp4
          ls -la out/dk/

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: DunningKruger3D
          path: out/dk/dunning-kruger-62s.mp4
          retention-days: 30
